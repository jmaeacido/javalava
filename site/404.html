.lost{
  position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;

}
.lost .bg{
  position:absolute;inset:-8%;background-size:cover;background-position:center;
  will-change:transform;transform:scale(1.06)
}
.lost .veil{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%,rgba(184,134,11,.18),transparent 62%),
    linear-gradient(180deg,rgba(10,8,6,.72),rgba(10,8,6,.55) 45%,rgba(10,8,6,.94))
}
.lost .ember{
  position:absolute;left:50%;top:58%;width:min(520px,78vw);height:180px;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(212,160,23,.22),transparent 68%);
  filter:blur(18px);animation:ember-pulse 4.8s ease-in-out infinite
}
.lost .inner{position:relative;z-index:2;max-width:720px;margin:0 auto;width:100%}
.lost .mark{
  width:min(220px,46vw);height:auto;margin:0 auto 28px;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));
  opacity:0;transform:translateY(18px)
}
.lost .code{
  font-family:var(--font-serif);letter-spacing:.42em;text-transform:uppercase;
  font-size:.72rem;color:var(--gold);font-weight:600;display:inline-block;
  opacity:0;transform:translateY(16px)
}
.lost h1{
  font-family:var(--font-display);font-weight:500;
  font-size:clamp(2.8rem,8vw,5.4rem);line-height:.98;margin:14px 0 18px;
  opacity:0;transform:translateY(22px)
}
.lost .rule{
  width:72px;height:1px;margin:0 auto 22px;background:var(--gold-grad);
  transform:scaleX(0);transform-origin:center;
  box-shadow:0 0 18px rgba(212,160,23,.35)
}
.lost p{
  max-width:440px;margin:0 auto;font-weight:300;color:rgba(244,235,221,.78);
  line-height:1.7;font-size:1.05rem;opacity:0;transform:translateY(18px)
}
.lost .actions{
  display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:34px;
  opacity:0;transform:translateY(18px)
}
@keyframes ember-pulse{
  0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-52%) scale(1.08)}
}
@media(max-width:860px){
  .lost{padding:110px 22px 70px}
  .lost .mark{width:min(168px,42vw);margin-bottom:22px}
}
@media(prefers-reduced-motion:reduce){

<script src="vendor/gsap.min.js"></script><script src="vendor/ScrollTrigger.min.js"></script><script src="vendor/lenis.min.js"></script><script src="js/site.js"></script>
<script>
(function(){
  if(!window.gsap){
    document.querySelectorAll('[data-lost],[data-lost-rule]').forEach(function(el){
      el.style.opacity='1';el.style.transform='none';
    });
    return;
  }
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){
    gsap.set('[data-lost],[data-lost-rule]',{opacity:1,scaleX:1,y:0});
    return;
  }
  var tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.to('.lost .mark',{opacity:1,y:0,duration:.7})
    .to('.lost .code',{opacity:1,y:0,duration:.55},'-=.35')
    .to('.lost h1',{opacity:1,y:0,duration:.7},'-=.35')
    .to('.lost .rule',{scaleX:1,duration:.55},'-=.4')
    .to('.lost p',{opacity:1,y:0,duration:.55},'-=.25')
    .to('.lost .actions',{opacity:1,y:0,duration:.55},'-=.3');
})();
</script>
